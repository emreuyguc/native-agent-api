# Test coverage limits for `make check-coverage` and the `check` job in CI (go-test-coverage).
# Raise a limit when coverage grows; never lower it to let a change pass.
profile: coverage.out

threshold:
  # Coverage of the whole module, in percent of statements.
  total: 71

# The packages that guard a security boundary or the API (docs/security.md) may not lose
# coverage. Each limit is about 2 points under the coverage of November 2026, so a small refactor
# passes but a removed test does not.
override:
  - path: ^internal/fsroot$
    threshold: 89
  - path: ^internal/permission$
    threshold: 87
  - path: ^internal/proctree$
    threshold: 86
  - path: ^internal/redact$
    threshold: 93
  - path: ^internal/config$
    threshold: 87
  - path: ^internal/httpapi$
    threshold: 83
  - path: ^internal/run$
    threshold: 82
  - path: ^internal/workspace$
    threshold: 72
  - path: ^internal/session$
    threshold: 60
