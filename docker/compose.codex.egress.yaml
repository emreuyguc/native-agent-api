# Restricted egress for the codex service (docs/security.md D-3). Combine with compose.yaml and
# compose.codex.yaml. The agent moves to an internal network without a route out: it reaches the
# network only through the allowlisting proxy, and the published API port through the ingress
# forwarder. The gateway then sees every client as the ingress container, so
# NATIVE_AGENT_ALLOWED_IPS cannot tell clients apart; restrict access with CODEX_HOST instead.
services:
  codex:
    networks: [codex-private]
    ports: !reset []
    environment:
      # Both spellings: the CLIs read upper case, curl and wget in the tools only lower case.
      HTTPS_PROXY: http://codex-egress:8888
      HTTP_PROXY: http://codex-egress:8888
      NO_PROXY: localhost,127.0.0.1
      https_proxy: http://codex-egress:8888
      http_proxy: http://codex-egress:8888
      no_proxy: localhost,127.0.0.1

  codex-egress:
    extends:
      file: compose.yaml
      service: edge-base
    profiles: ["codex"]
    command: ["tinyproxy", "-d", "-c", "/etc/tinyproxy/tinyproxy.conf"]
    networks: [default, codex-private]
    volumes:
      - ${CODEX_EGRESS_ALLOW_FILE:?CODEX_EGRESS_ALLOW_FILE must point to the egress allowlist}:/etc/egress/allow:ro

  codex-ingress:
    extends:
      file: compose.yaml
      service: edge-base
    profiles: ["codex"]
    command: ["socat", "TCP-LISTEN:8080,fork,reuseaddr", "TCP:codex:8080"]
    networks: [default, codex-private]
    ports:
      - "${CODEX_HOST:?CODEX_HOST is required}:${CODEX_PORT:?CODEX_PORT is required}:8080"

networks:
  codex-private:
    internal: true
