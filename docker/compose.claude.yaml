# Claude-specific image, resources, port and persistent state. Runtime hardening comes
# from the agent-base service in compose.yaml.
services:
  claude:
    extends:
      file: compose.yaml
      service: agent-base
    profiles: ["claude"]
    build:
      context: ..
      dockerfile: docker/claude/Dockerfile
      args:
        GO_IMAGE: ${GO_IMAGE:?GO_IMAGE is required}
        RUNTIME_IMAGE: ${RUNTIME_IMAGE:?RUNTIME_IMAGE is required}
        VERSION: ${BUILD_VERSION:?BUILD_VERSION is required}
        COMMIT: ${BUILD_COMMIT:?BUILD_COMMIT is required}
        DATE: ${BUILD_DATE:?BUILD_DATE is required}
    image: ${CLAUDE_IMAGE:?CLAUDE_IMAGE is required}
    env_file:
      - ${CLAUDE_APP_ENV_FILE:?CLAUDE_APP_ENV_FILE must point to a complete Claude application env file}
    mem_limit: ${CLAUDE_MEMORY_LIMIT:?CLAUDE_MEMORY_LIMIT is required}
    cpus: ${CLAUDE_CPUS:?CLAUDE_CPUS is required}
    ports:
      - "${CLAUDE_HOST:?CLAUDE_HOST is required}:${CLAUDE_PORT:?CLAUDE_PORT is required}:8080"
    volumes:
      # The whole HOME persists: the native profile keeps state both in ~/.claude and, for
      # Claude, in ~/.claude.json.
      - claude-home:/home/runner
      - claude-data:/data
      - claude-projects:/projects

volumes:
  claude-home:
    name: native-agent-api-claude-home
  claude-data:
    name: native-agent-api-claude-data
  claude-projects:
    name: native-agent-api-claude-projects
