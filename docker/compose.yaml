# One native-agent-api container. Two files hold the choices of one installation:
#   the Docker env file (--env-file, see docker/.env.example): name, agent, port and limits.
#   the application env file (CONTAINER_APP_ENV_FILE): token, logging and gateway limits.
# Everything else is fixed here or in the Dockerfiles, or derived from those choices.
# Run Compose from the repository root: COMPOSE_FILE paths are relative to it.

services:
  agent:
    build:
      context: ..
      dockerfile: docker/${CONTAINER_AGENT:?CONTAINER_AGENT is required}/Dockerfile
    image: native-agent-api-${CONTAINER_AGENT:?CONTAINER_AGENT is required}:local
    restart: unless-stopped
    init: true
    read_only: true
    user: "65532:65532"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # Fork-bomb guard, not a tuning value: it counts threads, and each CLI runtime and its MCP
    # servers, shells and compilers use dozens.
    pids_limit: 512
    mem_limit: ${CONTAINER_MEMORY:?CONTAINER_MEMORY is required}
    cpus: ${CONTAINER_CPUS:?CONTAINER_CPUS is required}
    tmpfs:
      # Executable on purpose (Docker defaults tmpfs to noexec): test runners and compilers run
      # binaries from TMPDIR, and noexec would add nothing while the workspaces under /data are
      # executable anyway. Claude Code also keeps command output there. It counts against the
      # memory limit.
      - /tmp:rw,exec,nosuid,nodev,size=256m,uid=65532,gid=65532,mode=700
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD", "/usr/local/bin/native-agent-api", "healthcheck"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    ports:
      - "${CONTAINER_PUBLISH_ADDR:?CONTAINER_PUBLISH_ADDR is required}:${CONTAINER_PUBLISH_PORT:?CONTAINER_PUBLISH_PORT is required}:8080"
    # The application settings the installation chooses. Compose does not read the shell for them.
    env_file:
      - ${CONTAINER_APP_ENV_FILE:?CONTAINER_APP_ENV_FILE must point to the application env file}
    # Settings the container layout fixes; they override the application env file.
    environment:
      # The image holds this agent's CLI.
      NATIVE_AGENT_AGENT: ${CONTAINER_AGENT:?CONTAINER_AGENT is required}
      # The container is the isolation boundary; bubblewrap cannot create namespaces in it.
      NATIVE_AGENT_SANDBOX_MODE: external
      # The published port reaches the container interface, never its loopback.
      NATIVE_AGENT_LISTEN: 0.0.0.0:8080
      # Named volumes; HOME is one too, so the native profile and its login persist.
      NATIVE_AGENT_DATA_DIR: /data
      NATIVE_AGENT_ALLOWED_ROOTS: /projects
      NATIVE_AGENT_PROFILE_DIR: native
    volumes:
      # The whole HOME persists: the native profile keeps state in ~/.claude and ~/.claude.json
      # (Claude) or ~/.codex (Codex).
      - home:/home/runner
      - data:/data
      - projects:/projects

# Named after COMPOSE_PROJECT_NAME, so each installation keeps its own login and data.
volumes:
  home:
    name: ${COMPOSE_PROJECT_NAME:?COMPOSE_PROJECT_NAME is required}-home
  data:
    name: ${COMPOSE_PROJECT_NAME:?COMPOSE_PROJECT_NAME is required}-data
  projects:
    name: ${COMPOSE_PROJECT_NAME:?COMPOSE_PROJECT_NAME is required}-projects
