# One native-agent-api container. Two files describe one installation:
#   the Docker env file (--env-file, see docker/.env.example): Compose settings, the image, port
#     and limits, and the path of the application env file. It holds no application setting.
#   the application env file (CONTAINER_APP_ENV_FILE): the NATIVE_AGENT_* settings.
# Run Compose from the repository root: COMPOSE_FILE paths are relative to it.

services:
  agent:
    build:
      context: ..
      dockerfile: docker/${CONTAINER_AGENT:?CONTAINER_AGENT is required}/Dockerfile
      args:
        GO_IMAGE: ${GO_IMAGE:?GO_IMAGE is required}
        RUNTIME_IMAGE: ${RUNTIME_IMAGE:?RUNTIME_IMAGE is required}
        VERSION: ${BUILD_VERSION:?BUILD_VERSION is required}
        COMMIT: ${BUILD_COMMIT:?BUILD_COMMIT is required}
        DATE: ${BUILD_DATE:?BUILD_DATE is required}
    image: ${CONTAINER_IMAGE:?CONTAINER_IMAGE is required}
    restart: unless-stopped
    init: true
    read_only: true
    user: "65532:65532"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # Fork-bomb guard, not a tuning value: it counts threads, and each CLI runtime and its MCP
    # servers, shells and compilers use dozens.
    pids_limit: 512
    mem_limit: ${CONTAINER_MEMORY:?CONTAINER_MEMORY is required}
    cpus: ${CONTAINER_CPUS:?CONTAINER_CPUS is required}
    tmpfs:
      # Executable on purpose (Docker defaults tmpfs to noexec): test runners and compilers run
      # binaries from TMPDIR, and noexec would add nothing while the workspaces under /data are
      # executable anyway. Claude Code also keeps command output there. It counts against the
      # memory limit.
      - /tmp:rw,exec,nosuid,nodev,size=256m,uid=65532,gid=65532,mode=700
    stop_grace_period: 10s
    healthcheck:
      # The CLI check makes the container unhealthy when CONTAINER_AGENT (the image) and
      # NATIVE_AGENT_AGENT (the application) name different agents: each adapter runs its CLI by
      # the agent's name.
      test: ["CMD-SHELL", "native-agent-api healthcheck && command -v \"$$NATIVE_AGENT_AGENT\" >/dev/null"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    ports:
      - "${CONTAINER_PUBLISH_ADDR:?CONTAINER_PUBLISH_ADDR is required}:${CONTAINER_PUBLISH_PORT:?CONTAINER_PUBLISH_PORT is required}:8080"
    # The application settings, from their own file. Compose does not read the shell for them.
    env_file:
      - ${CONTAINER_APP_ENV_FILE:?CONTAINER_APP_ENV_FILE must point to the application env file}
    volumes:
      # The whole HOME persists: the native profile keeps state in ~/.claude and ~/.claude.json
      # (Claude) or ~/.codex (Codex).
      - home:/home/runner
      - data:/data
      - projects:/projects

# Named after COMPOSE_PROJECT_NAME, so each installation keeps its own login and data.
volumes:
  home:
    name: ${COMPOSE_PROJECT_NAME:?COMPOSE_PROJECT_NAME is required}-home
  data:
    name: ${COMPOSE_PROJECT_NAME:?COMPOSE_PROJECT_NAME is required}-data
  projects:
    name: ${COMPOSE_PROJECT_NAME:?COMPOSE_PROJECT_NAME is required}-projects
