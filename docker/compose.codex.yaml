# Codex-specific image, resources, port and persistent state. Runtime hardening comes
# from the agent-base service in compose.yaml.
services:
  codex:
    extends:
      file: compose.yaml
      service: agent-base
    profiles: ["codex"]
    build:
      context: ..
      dockerfile: docker/codex/Dockerfile
      args:
        GO_IMAGE: ${GO_IMAGE:?GO_IMAGE is required}
        RUNTIME_IMAGE: ${RUNTIME_IMAGE:?RUNTIME_IMAGE is required}
        VERSION: ${BUILD_VERSION:?BUILD_VERSION is required}
        COMMIT: ${BUILD_COMMIT:?BUILD_COMMIT is required}
        DATE: ${BUILD_DATE:?BUILD_DATE is required}
    image: ${CODEX_IMAGE:?CODEX_IMAGE is required}
    env_file:
      - ${CODEX_APP_ENV_FILE:?CODEX_APP_ENV_FILE must point to a complete Codex application env file}
    mem_limit: ${CODEX_MEMORY_LIMIT:?CODEX_MEMORY_LIMIT is required}
    cpus: ${CODEX_CPUS:?CODEX_CPUS is required}
    ports:
      - "${CODEX_HOST:?CODEX_HOST is required}:${CODEX_PORT:?CODEX_PORT is required}:8080"
    volumes:
      # The whole HOME persists: the native profile keeps state both in ~/.codex and, for
      # Claude, in ~/.claude.json.
      - codex-home:/home/runner
      - codex-data:/data
      - codex-projects:/projects

volumes:
  codex-home:
    name: native-agent-api-codex-home
  codex-data:
    name: native-agent-api-codex-data
  codex-projects:
    name: native-agent-api-codex-projects
