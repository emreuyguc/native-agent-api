# Allowlisting forward proxy. The allowlist (/etc/egress/allow) holds one extended regular
# expression per line, matched against the destination host name only.
Port 8888
Listen 0.0.0.0
Timeout 600
MaxClients 64
LogLevel Notice
Allow 0.0.0.0/0
Filter "/etc/egress/allow"
FilterType ere
FilterURLs Off
FilterCaseSensitive Off
FilterDefaultDeny Yes
ConnectPort 443
ConnectPort 80
DisableViaHeader Yes
