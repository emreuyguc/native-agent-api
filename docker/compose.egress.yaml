# Restricted egress (docs/security.md D-3). Add it after compose.yaml in COMPOSE_FILE. The agent
# moves to an internal network without a route out: it reaches the network only through the
# allowlisting proxy (egress), and the published API port through a forwarder (ingress). The
# gateway then sees every client as the forwarder, so NATIVE_AGENT_ALLOWED_IPS cannot tell clients
# apart; restrict access with CONTAINER_PUBLISH_ADDR and the host firewall instead.

x-edge: &edge
  build:
    context: ..
    dockerfile: docker/edge/Dockerfile
    args:
      RUNTIME_IMAGE: ${RUNTIME_IMAGE:?RUNTIME_IMAGE is required}
  image: native-agent-api-edge:local
  restart: unless-stopped
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 64
  mem_limit: 64m

services:
  agent:
    networks: [private]
    ports: !reset []
    environment:
      # Both spellings: the CLIs read upper case, curl and wget in the tools only lower case.
      HTTPS_PROXY: http://egress:8888
      HTTP_PROXY: http://egress:8888
      NO_PROXY: localhost,127.0.0.1
      https_proxy: http://egress:8888
      http_proxy: http://egress:8888
      no_proxy: localhost,127.0.0.1

  egress:
    <<: *edge
    command: ["tinyproxy", "-d", "-c", "/etc/tinyproxy/tinyproxy.conf"]
    networks: [default, private]
    volumes:
      - ${CONTAINER_EGRESS_ALLOW_FILE:?CONTAINER_EGRESS_ALLOW_FILE must point to the egress allowlist}:/etc/egress/allow:ro

  ingress:
    <<: *edge
    command: ["socat", "TCP-LISTEN:8080,fork,reuseaddr", "TCP:agent:8080"]
    networks: [default, private]
    ports:
      - "${CONTAINER_PUBLISH_ADDR:?CONTAINER_PUBLISH_ADDR is required}:${CONTAINER_PUBLISH_PORT:?CONTAINER_PUBLISH_PORT is required}:8080"

networks:
  private:
    internal: true
