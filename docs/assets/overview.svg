<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-labelledby="title desc">
  <title id="title">native-agent-api overview</title>
  <desc id="desc">Clients call native-agent-api over REST, SSE and WebSocket. The gateway runs the native Claude Code or Codex CLI over its stdio protocol and streams the native events back.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <marker id="arrow-request" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#60a5fa"/>
    </marker>
    <marker id="arrow-event" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#a78bfa"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .head { font-size: 15px; font-weight: 600; fill: #e6edf3; text-anchor: middle; }
    .sub { font-size: 11px; fill: #8b949e; text-anchor: middle; }
    .pill { fill: #1c2230; stroke: #30363d; }
    .item { font-size: 12px; fill: #c9d1d9; text-anchor: middle; }
    .label { font-size: 10.5px; text-anchor: middle; }
    .note { font-size: 11.5px; fill: #8b949e; text-anchor: middle; }
    .flow { fill: none; stroke-width: 2; stroke-dasharray: 6 8; animation: flow 0.9s linear infinite; }
    .request { stroke: #60a5fa; }
    .event { stroke: #a78bfa; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes flow { to { stroke-dashoffset: -14; } }
    @keyframes pulse { 0%, 100% { stroke-opacity: 0.45; } 50% { stroke-opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .flow, .pulse { animation: none; } }
  </style>

  <rect x="1" y="1" width="958" height="328" rx="18" fill="url(#bg)" stroke="#30363d"/>

  <!-- Clients -->
  <rect x="28" y="28" width="220" height="244" rx="14" fill="#11161f" stroke="#30363d"/>
  <text class="head" x="138" y="60">Your clients</text>
  <text class="sub" x="138" y="80">any language, any host</text>
  <rect class="pill" x="44" y="102" width="188" height="36" rx="9"/>
  <text class="item" x="138" y="125">Apps and services</text>
  <rect class="pill" x="44" y="150" width="188" height="36" rx="9"/>
  <text class="item" x="138" y="173">Scripts and CI jobs</text>
  <rect class="pill" x="44" y="198" width="188" height="36" rx="9"/>
  <text class="item" x="138" y="221">Web UIs and bots</text>

  <!-- Gateway -->
  <rect x="372" y="28" width="216" height="244" rx="14" fill="#11161f"/>
  <rect class="pulse" x="372" y="28" width="216" height="244" rx="14" fill="none" stroke="url(#core)" stroke-width="2"/>
  <text class="head" x="480" y="60">native-agent-api</text>
  <text class="sub" x="480" y="80">one Go binary · one agent</text>
  <rect class="pill" x="388" y="98" width="184" height="32" rx="8"/>
  <text class="item" x="480" y="119">Token auth · IP allowlist</text>
  <rect class="pill" x="388" y="140" width="184" height="32" rx="8"/>
  <text class="item" x="480" y="161">Runs · sessions · workspaces</text>
  <rect class="pill" x="388" y="182" width="184" height="32" rx="8"/>
  <text class="item" x="480" y="203">Live events · resumable</text>
  <rect class="pill" x="388" y="224" width="184" height="32" rx="8"/>
  <text class="item" x="480" y="245">Permissions · usage · login</text>

  <!-- Native CLIs -->
  <rect x="712" y="28" width="220" height="244" rx="14" fill="#11161f" stroke="#30363d"/>
  <text class="head" x="822" y="60">Native agent CLI</text>
  <text class="sub" x="822" y="80">one per gateway · your own login</text>
  <rect x="728" y="98" width="188" height="44" rx="9" fill="#1c2230" stroke="#d97757"/>
  <text class="item" x="822" y="117" style="font-weight:600">Claude Code</text>
  <text class="sub mono" x="822" y="133">claude</text>
  <rect x="728" y="152" width="188" height="44" rx="9" fill="#1c2230" stroke="#10a37f"/>
  <text class="item" x="822" y="171" style="font-weight:600">Codex CLI</text>
  <text class="sub mono" x="822" y="187">codex</text>
  <text class="sub" x="822" y="226">sessions · tools · skills · hooks</text>
  <text class="sub" x="822" y="246">plugins · subagents · MCP servers</text>

  <!-- Client ⇄ gateway -->
  <text class="label" x="310" y="110" fill="#93c5fd">REST · JSON</text>
  <path class="flow request" d="M254 122 H364" marker-end="url(#arrow-request)"/>
  <path class="flow event" d="M366 196 H256" marker-end="url(#arrow-event)"/>
  <text class="label" x="310" y="216" fill="#c4b5fd">SSE · WebSocket</text>

  <!-- Gateway ⇄ CLI -->
  <text class="label" x="650" y="110" fill="#93c5fd">native stdio protocol</text>
  <path class="flow request" d="M594 122 H704" marker-end="url(#arrow-request)"/>
  <path class="flow event" d="M706 196 H596" marker-end="url(#arrow-event)"/>
  <text class="label" x="650" y="216" fill="#c4b5fd">native events</text>

  <text class="note" x="480" y="305">The gateway adds an API, not a new agent: native behavior stays native.</text>
</svg>
