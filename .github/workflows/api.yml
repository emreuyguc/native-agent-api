name: api

# A pull request may not break API clients unless it is labeled `api-breaking`.
# docs/development.md, "API compatibility", describes the check.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

# A new push or label change cancels the older run of the same pull request.
concurrency:
  group: api-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  breaking-changes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Compare the API with the base branch
        env:
          BASE_REF: ${{ github.base_ref }}
          ALLOWED: ${{ contains(github.event.pull_request.labels.*.name, 'api-breaking') }}
        run: |
          if scripts/api-diff.sh "origin/$BASE_REF"; then exit 0; fi
          if [ "$ALLOWED" = true ]; then
            echo "::notice::Breaking API changes accepted by the api-breaking label."
            exit 0
          fi
          echo "::error::The API change breaks clients. If intended, label the pull request api-breaking."
          exit 1
