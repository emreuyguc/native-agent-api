name: ci

on:
  push:
    branches: [main]
  pull_request:
  # release.yml runs the checks before it publishes; it builds and pushes the images itself.
  workflow_call:

permissions:
  contents: read

# A new push to a pull request cancels its older run. Runs on main and in release.yml finish.
# The ci- prefix keeps the group apart from release.yml, which calls this workflow.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # The tool modules in tools/ are built too.
          cache-dependency-path: "**/go.sum"
      # The same target as the pre-commit hook; docs/development.md lists every target.
      - run: make check-pre-commit
      - name: Coverage in the run summary
        if: ${{ !cancelled() && hashFiles('coverage.txt') != '' }}
        run: |
          { echo '```'; cat coverage.txt; echo '```'; } >>"$GITHUB_STEP_SUMMARY"
      - run: make lint-scripts

  # zizmor finds unsafe patterns in the workflows: injection, token exposure, cache poisoning.
  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The token lets zizmor look up actions with known vulnerabilities.
      - run: make audit-workflows ZIZMOR_ONLINE=1
        env:
          GH_TOKEN: ${{ github.token }}

  # A pull request may not add a dependency with a known high or critical vulnerability.
  dependencies:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  docker:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    needs: check
    strategy:
      fail-fast: false
      matrix:
        image: [claude, codex, edge]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build ${{ matrix.image }} image (amd64 + arm64)
        run: make build-images IMAGE="$IMAGE" PLATFORMS=linux/amd64,linux/arm64
        env:
          IMAGE: ${{ matrix.image }}
