name: ci

on:
  push:
    branches: [main]
  pull_request:
  # release.yml runs the checks before it publishes; it builds and pushes the images itself.
  workflow_call:

permissions:
  contents: read

# A new push to a pull request cancels its older run. Runs on main and in release.yml finish.
# The ci- prefix keeps the group apart from release.yml, which calls this workflow.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      # The golangci-lint version of tools/golangci-lint/go.mod, as a released binary: building it
      # from source adds more than a minute to a run with an empty cache.
      - name: golangci-lint version
        id: golangci-lint
        working-directory: tools/golangci-lint
        run: echo "version=$(go list -m -f '{{.Version}}' github.com/golangci/golangci-lint/v2)" >>"$GITHUB_OUTPUT"
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ steps.golangci-lint.outputs.version }}
          install-only: true
      # The targets of the pre-commit hook and the Docker-based checks, three at a time; each
      # target's output stays together. docs/development.md lists every target.
      # -shuffle=on finds tests that depend on their order; locally it would disable the test cache.
      - run: >-
          make -j3 --output-sync=target
          check-pre-commit lint-scripts lint-dockerfiles check-release-config
          GOLANGCI_LINT=golangci-lint TESTFLAGS="-count=1 -shuffle=on"
      - name: Coverage in the run summary
        if: ${{ !cancelled() && hashFiles('coverage.txt') != '' }}
        run: |
          { echo '```'; cat coverage.txt; echo '```'; } >>"$GITHUB_STEP_SUMMARY"

  # The release ships darwin binaries; process groups, the process table and os.Root differ there.
  macos:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make test TESTFLAGS="-count=1 -shuffle=on"

  # zizmor finds unsafe patterns in the workflows: injection, token exposure, cache poisoning.
  workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The token lets zizmor look up actions with known vulnerabilities.
      - run: make audit-workflows ZIZMOR_ONLINE=1
        env:
          GH_TOKEN: ${{ github.token }}

  # A pull request may not add a dependency with a known high or critical vulnerability.
  dependencies:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  # `make build-images` builds the same Dockerfiles locally. Here each architecture builds on its
  # own native runner, without QEMU, with a BuildKit cache per image and architecture in GitHub.
  # The jobs start without waiting for `check`. The amd64 jobs keep the names `docker (<image>)`
  # that the ruleset requires.
  docker:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    name: docker (${{ matrix.image }}${{ matrix.arch == 'arm64' && ', arm64' || '' }})
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image: [claude, codex, edge]
        arch: [amd64, arm64]
    env:
      # An agent image on amd64 is loaded into Docker, then smoke-tested and scanned.
      TEST: ${{ matrix.arch == 'amd64' && matrix.image != 'edge' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The image to test rebuilds its runtime stage without the cache, so its Alpine packages are
      # current for the scan; the Go build and the CLI download come from the cache.
      - name: Build ${{ matrix.image }} image (${{ matrix.arch }})
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/${{ matrix.image }}/Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: ${{ env.TEST == 'true' }}
          tags: ${{ env.TEST == 'true' && format('native-agent-api-imagetest-{0}:local', matrix.image) || '' }}
          no-cache-filters: ${{ env.TEST == 'true' && 'runtime' || '' }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}
      # An agent image must start hardened and healthy without a login, and its packages must have
      # no fixed high or critical vulnerability. The edge image is scanned weekly (scan.yml).
      - name: Smoke test ${{ matrix.image }} image
        if: env.TEST == 'true'
        run: make test-image AGENT=${{ matrix.image }} NO_BUILD=1
      - name: Scan ${{ matrix.image }} image
        if: env.TEST == 'true'
        run: make scan-images SCAN=native-agent-api-imagetest-${{ matrix.image }}:local
