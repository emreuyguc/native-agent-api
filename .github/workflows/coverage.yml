name: coverage

# Test coverage for GitHub Code Quality: pull requests show it, and the main ruleset can require
# a minimum. GitHub reads Cobertura XML, so the Go profile is converted first.
on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: coverage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      code-quality: write # upload the report
      pull-requests: read # find the pull request of a push
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Measure coverage
        run: make coverage
      - uses: actions/upload-code-coverage@2b21a77928be8d5168c2b9581a67f2adbebacc52 # v1.4.4
        with:
          file: coverage.xml
          language: Go
          label: code-coverage/go
