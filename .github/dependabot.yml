# Weekly update pull requests for Go modules, the pinned GitHub Actions and the Docker base images.
# The agent CLI releases (cli_version in docker/<agent>/Dockerfile) are updated by hand: Dependabot
# does not know them.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-modules:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        update-types: [minor, patch]

  # One group, so every Dockerfile keeps the same pins (internal/buildinfo checks it).
  - package-ecosystem: docker
    directories:
      - /docker/claude
      - /docker/codex
      - /docker/edge
    schedule:
      interval: weekly
    groups:
      docker-images:
        patterns: ["*"]
