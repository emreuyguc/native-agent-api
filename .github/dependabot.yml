# Weekly update pull requests for Go modules, the pinned GitHub Actions and the Docker base images.
# A release is proposed only after 14 days, so a compromised or broken release can be withdrawn
# before it reaches this repository.
# The agent CLI releases (cli_version in docker/<agent>/Dockerfile) are updated by hand: Dependabot
# does not know them.
version: 2
updates:
  - package-ecosystem: gomod
    directories: [/, /tools]
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      go-modules:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      github-actions:
        update-types: [minor, patch]

  # One group, so every Dockerfile keeps the same pins (internal/buildinfo checks it).
  - package-ecosystem: docker
    directories:
      - /docker/claude
      - /docker/codex
      - /docker/edge
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      docker-images:
        patterns: ["*"]
