# golangci-lint v2 configuration. Run with `make lint-go`.
version: "2"

run:
  timeout: 5m

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - contextcheck
    - copyloopvar
    - errname
    - errorlint
    - exhaustive
    - gocritic
    - gosec
    - intrange
    - misspell
    - modernize
    - nilerr
    - noctx
    - nolintlint
    - perfsprint
    - revive
    - unconvert
    - unparam
    - usestdlibvars
    - wastedassign
  settings:
    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
    gocritic:
      enabled-tags: [diagnostic, performance, style]
      disabled-checks: [hugeParam, unnamedResult, whyNoLint]
    gosec:
      excludes:
        - G204 # Subprocess launched with variable: launching the agent CLI is the purpose of this project.
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
        - name: unused-parameter
        - name: context-as-argument
        - name: error-return
        - name: error-strings
        - name: receiver-naming
  exclusions:
    presets: [comments, std-error-handling]
    rules:
      - path: _test\.go
        linters: [gosec, errcheck, bodyclose, noctx]

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes: [github.com/emreuyguc/native-agent-api]
