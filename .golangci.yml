# golangci-lint v2 configuration. Run with `make lint-go`.
version: "2"

run:
  timeout: 5m

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - contextcheck
    - copyloopvar
    - depguard
    - errname
    - errorlint
    - exhaustive
    - forbidigo
    - gocritic
    - gosec
    - intrange
    - misspell
    - modernize
    - nilerr
    - noctx
    - nolintlint
    - perfsprint
    - revive
    - unconvert
    - unparam
    - usestdlibvars
    - wastedassign
  settings:
    # AGENTS.md: adapters live in internal/agent/<name>; nothing outside them branches on the agent.
    depguard:
      rules:
        adapters:
          files:
            - $all
            - "!$test"
            - "!**/internal/agent/builtin/**"
            - "!**/internal/agent/claude/**"
            - "!**/internal/agent/codex/**"
          deny:
            - pkg: github.com/emreuyguc/native-agent-api/internal/agent/claude
              desc: only internal/agent/builtin selects an adapter
            - pkg: github.com/emreuyguc/native-agent-api/internal/agent/codex
              desc: only internal/agent/builtin selects an adapter
    # AGENTS.md: the server environment never reaches the CLI. Only internal/cli reads it, once, at
    # startup; everything else gets explicit configuration.
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^os\.(Getenv|LookupEnv|Environ|Setenv|Unsetenv|Clearenv)$
          msg: read the environment only in internal/cli and pass explicit configuration
    gocritic:
      enabled-tags: [diagnostic, performance, style]
      disabled-checks: [hugeParam, unnamedResult, whyNoLint]
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
        - name: unused-parameter
        - name: context-as-argument
        - name: error-return
        - name: error-strings
        - name: receiver-naming
  exclusions:
    presets: [comments, std-error-handling]
    rules:
      - path: _test\.go
        linters: [gosec, errcheck, bodyclose, noctx, forbidigo]
      - path: ^internal/cli/
        linters: [forbidigo]

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes: [github.com/emreuyguc/native-agent-api]
